server:
  port: 8103
  servlet:
    context-path: /api

spring:
  application:
    name: airs-backend
  datasource:
    url: jdbc:sqlite:airs.db
    driver-class-name: org.sqlite.JDBC
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          use_get_generated_keys: false
        id:
          new_generator_mappings: true

jwt:
  secret: airs-athlete-injury-rehabilitation-tracking-system-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.airs: debug
    org.springframework.security: info
